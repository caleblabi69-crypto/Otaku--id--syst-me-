<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku ID System - Officiel</title>
    <meta name="description" content="Crée ta carte Otaku et télécharge-la facilement.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div id="authSection" class="panel active">
            <h1>Espace Membre Otaku</h1>
            <div class="form-grid auth-grid">
                <input type="text" id="username" placeholder="Nom d'utilisateur (min 3 caractères)">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Mot de passe (min 6 caractères)">
                    <button type="button" class="icon-btn" id="togglePassword" aria-label="Afficher le mot de passe">👁️</button>
                </div>
                <label class="remember-me" for="rememberMe">
                    <input type="checkbox" id="rememberMe">
                    <span>Se souvenir de moi</span>
                </label>
                <button type="button" onclick="login()">Se Connecter</button>
                <button type="button" onclick="register()" class="btn-alt">Créer un Compte</button>
            </div>
        </div>

        <div id="generatorSection" class="panel" style="display:none;">
            <div class="generator-header">
                <h1>Créer ta Carte Otaku</h1>
                <button type="button" class="btn-ghost" onclick="logout()">Déconnexion</button>
            </div>
            <p>Bienvenue, <span id="userDisplay" class="user-display"></span> !</p>

            <div class="form-grid generator-grid">
                <input type="text" id="pseudoInput" placeholder="Ton Pseudo">
                <input type="text" id="statutInput" placeholder="Ton Statut (ex: Otaku Officiel)">
                <input type="text" id="passionsInput" placeholder="Tes Passions (ex: Manga • Sport)">

                <select id="classementInput">
                    <option value="" disabled selected>Ton Niveau</option>
                    <option value="A ★★★★">Niveau A</option>
                    <option value="S ★★★★★">Niveau S</option>
                    <option value="SS ★★★★★★">Niveau SS</option>
                    <option value="SSS ★★★★★★★">Niveau SSS</option>
                </select>

                <select id="themeSelect">
                    <option value="neon">Thème Neon</option>
                    <option value="sunset">Sunset</option>
                    <option value="forest">Forest</option>
                    <option value="midnight">Midnight</option>
                </select>

                <label for="imageInput" class="custom-file-upload">📷 Choisir ma Photo</label>
                <input type="file" id="imageInput" accept="image/*" onchange="previewImage()">

                <button type="button" onclick="generateFinalCard()">Générer la Carte</button>
                <button id="downloadBtn" style="display:none;" class="download-btn" onclick="handleDownload()">💾 Télécharger ma carte</button>
                <button id="resetBtn" style="display:none;" class="btn-alt" onclick="resetCard()">🔄 Régénérer</button>
            </div>

            <div class="preview-zone">
                <img id="imagePreview" style="display:none;">
            </div>

            <canvas id="otakuCanvas" width="1000" height="641" style="display:none;"></canvas>
            <div id="downloadLink" style="display:none;"></div>
        </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
